<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Apply a saved theme before the page paints, to avoid a flash.
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>
  {% seo %}
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">Claudio Malvino</a>
      <nav class="site-nav">
        <a href="{{ '/projects.html' | relative_url }}">Projects</a>
        <a href="{{ '/experience.html' | relative_url }}">Experience</a>
        <a href="{{ '/about.html' | relative_url }}">About</a>
        <a href="{{ '/publications.html' | relative_url }}">Publications</a>
        <a href="{{ '/assets/Claudio-Malvino-Resume.pdf' | relative_url }}">Resume</a>
        <button class="theme-toggle" type="button" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="container" id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© {{ 'now' | date: "%Y" }} Claudio Malvino</span>
      <span>
        <a href="mailto:claudiormal@gmail.com">claudiormal@gmail.com</a> ·
        <a href="https://github.com/ClaudioRMalvino">GitHub</a> ·
        <a href="https://www.linkedin.com/in/claudiomalvino">LinkedIn</a>
      </span>
    </div>
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var button = document.querySelector('.theme-toggle');
      function current() {
        return root.dataset.theme ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      }
      function label() {
        var next = current() === 'dark' ? 'light' : 'dark';
        button.setAttribute('aria-label', 'Switch to ' + next + ' theme');
        button.title = 'Switch to ' + next + ' theme';
      }
      button.hidden = false;
      label();
      button.addEventListener('click', function () {
        var next = current() === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem('theme', next); } catch (e) {}
        label();
      });
    })();
  </script>
</body>
</html>
